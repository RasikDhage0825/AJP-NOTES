<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#151e32" />
    </linearGradient>
    <linearGradient id="leaf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="512" height="512" rx="115" fill="url(#bg)" />
  <rect width="504" height="504" x="4" y="4" rx="111" fill="none" stroke="url(#leaf)" stroke-width="4" opacity="0.4" />
  <!-- Spring Leaf Logo -->
  <g filter="url(#glow)" transform="translate(40, 20)">
    <path d="M 216 70 C 130 90 70 170 70 260 C 70 355 145 425 240 425 C 330 425 405 355 410 260 C 410 255 410 250 409 245 C 375 295 315 330 250 330 C 160 330 95 260 95 180 C 95 130 145 80 216 70 Z" fill="url(#leaf)" />
    <circle cx="340" cy="150" r="32" fill="url(#accent)" opacity="0.9" />
  </g>
</svg>
